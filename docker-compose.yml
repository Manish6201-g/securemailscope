services:
  securemailscope:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: securemailscope-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - MAX_UPLOAD_SIZE_MB=50
      - ALLOWED_ORIGINS=*
    volumes:
      - securemailscope-uploads:/app/backend/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  securemailscope-uploads:
    driver: local
